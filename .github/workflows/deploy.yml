name: Deploy Venus Project

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Git Pull latest code
        shell: sh
        run: cd /volume1/docker/venus && git pull origin master

      - name: Build and Deploy new stack
        shell: sh
        env:
          DOCKER_API_VERSION: "1.43"
          COMPOSE_PROJECT_NAME: venus
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
        run: |
          docker-compose -p venus build --no-cache --pull
          docker-compose -p venus up -d --remove-orphans --force-recreate

      - name: Cleanup old images
        env:
          DOCKER_API_VERSION: "1.43"
        run: |
          docker image prune -f