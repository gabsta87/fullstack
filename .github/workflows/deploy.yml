name: Deploy Venus Project

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: self-hosted
    env:
      DOCKER_API_VERSION: "1.43"
      COMPOSE_PROJECT_NAME: venus
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Force copy project files to NAS
        run: |
          echo "Copie du docker-compose.yml..."
          cp -f docker-compose.yml /volume1/docker/venus/docker-compose.yml
          
          echo "Copie du dossier front..."
          rm -rf /volume1/docker/venus/front
          cp -r front /volume1/docker/venus/
          
          echo "Copie du dossier serv..."
          rm -rf /volume1/docker/venus/serv
          cp -r serv /volume1/docker/venus/
          
          echo "Vérification des fichiers copiés :"
          ls -la /volume1/docker/venus/

      - name: Build new images
        working-directory: /volume1/docker/venus
        run: docker-compose build --no-cache --pull

      - name: Stop and remove old containers
        working-directory: /volume1/docker/venus
        run: docker-compose down

      - name: Deploy new stack
        working-directory: /volume1/docker/venus
        run: |
          docker-compose up -d --remove-orphans --force-recreate

      - name: Cleanup old images
        run: |
          docker image prune -f
