name: Deploy Venus Project

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  # Runs on GitHub-hosted machines: nothing is deployed if a single test fails.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Backend tests
        working-directory: serv
        run: ./gradlew test --no-daemon

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: No debug console.log in front code
        run: |
          if grep -rn "console\.log" front/src/app --include='*.ts' | grep -v '\.spec\.ts'; then
            echo "Remove console.log calls (use console.warn / console.error for real problems)" >&2; exit 1
          fi

      - name: Every Ionic tag used in templates is registered
        run: |
          missing=0
          for tag in $(grep -rhoE "<ion-[a-z-]+" front/src/app --include='*.html' | sed 's/<//' | sort -u); do
            grep -q "'$tag'" front/src/app/ionic-elements.ts || { echo "Missing in ionic-elements.ts: $tag" >&2; missing=1; }
          done
          exit $missing

      - name: Front tests
        working-directory: front
        run: |
          npm ci
          npx ng test --watch=false --browsers=ChromeHeadless

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: self-hosted
    steps:
      - name: Update sources
        env:
          SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          KEY_FILE=$(mktemp)
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          cd /volume1/docker/venus
          git config --global --add safe.directory /volume1/docker/venus
          git pull origin master

      - name: Build and Deploy
        env:
          COMPOSE_PROJECT_NAME: venus
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ "${#JWT_SECRET}" -lt 32 ]; then echo "JWT_SECRET secret is missing or shorter than 32 characters" >&2; exit 1; fi
          cd /volume1/docker/venus
          docker compose -p venus build --no-cache --pull
          docker compose -p venus up -d --remove-orphans

      - name: Cleanup
        run: docker image prune -f
