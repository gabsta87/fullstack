services:
  db:
    # 8.4 LTS (supported until 2032). Upgrades must go one LTS at a time: 8.0 -> 8.4 -> 9.7.
    # Each version must have started once on the data before the next one. Back up first (see ROADMAP).
    image: mysql:8.4
    container_name: venus-db
    # Rotated logs: at most 5 x 10 MB per container on the NAS disk
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}" ]
      interval: 20s
      timeout: 20s
      retries: 10
      start_period: 120s
    networks:
      default:
        aliases:
          - db
          - venus-db
    deploy:
      resources:
        limits:
          memory: 1G

  backend:
    build: ./serv
    image: venus-backend:latest
    container_name: venus-backend
    # Rotated logs: at most 5 x 10 MB per container on the NAS disk
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://venus-db:3306/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=30000&socketTimeout=60000&tcpKeepAlive=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      
      # Configuration pour la stabilité au démarrage
      SPRING_DATASOURCE_TESTONBORROW: "true"
      SPRING_DATASOURCE_VALIDATIONQUERY: "SELECT 1"
      
      # HikariCP : ne pas crasher si la DB est lente à répondre
      SPRING_DATASOURCE_HIKARI_CONNECTIONTIMEOUT: "60000"
      SPRING_DATASOURCE_HIKARI_INITIALIZATIONFAILTIMEOUT: "30000"
      SPRING_JPA_PROPERTIES_HIBERNATE_CONNECTION_TIMEOUT: "60000"

      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"

#      LOGGING_LEVEL_ROOT: "DEBUG"
#      LOGGING_LEVEL_COM_SERV: "DEBUG"
      
      SPRING_APPLICATION_JSON: '{"media.upload.base": "/var/serv-media", "media.public.url": "/media", "media.private.base": "/var/serv-private"}'
      
      # Mémoire
      JAVA_OPTS: "-Xms512m -Xmx1024m"
      
    volumes:
      - media-data:/var/serv-media
      # Certification photos: mounted in the backend only, never served by nginx
      - private-media:/var/serv-private
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure:2
    deploy:
      resources:
        limits:
          memory: 1.5G
    networks:
      - default

  frontend:
    build: ./front
    container_name: venus-frontend
    # Rotated logs: at most 5 x 10 MB per container on the NAS disk
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "8888:8081"
    volumes:
      - media-data:/var/serv-media:ro
    depends_on:
      - backend
    networks:
      - default

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: venus-phpmyadmin
    # Rotated logs: at most 5 x 10 MB per container on the NAS disk
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      PMA_HOST: venus-db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      # Only reachable from the NAS itself (use an SSH tunnel: ssh -L 8082:localhost:8082 nas)
      - "127.0.0.1:8082:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default

volumes:
  db-data:
  media-data:
  private-media:

networks:
  default:
    name: venus-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.1.0/24
        # this subnet is allowed in the firewall
