# application-prod.properties

server.forward-headers-strategy=framework
server.port=8080

# Base de données Production
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate

# Stripe Prod
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.public.key=${STRIPE_PUBLIC_KEY}

spring.mail.host=mail.infomaniak.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=false

app.frontend-url=http://venustest.synology.me
app.mail.sender=no-reply@mondomaine.com

media.upload.base=/var/serv-media
media.public.base-url=/media

app.registration.email-verification-required=true