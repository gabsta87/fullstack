spring.application.name=venus
server.servlet.session.timeout=1d
spring.jpa.open-in-view=false

# Stripe
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

# Upload limits (MediaStorageService enforces 20 MB per image and 50 MB per video)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
# Never expose exception details to clients
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
# Logging: one line per event, with the request id (also returned in the X-Request-Id header)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{requestId:--}] %-36.36logger{35} : %m%n%wEx
logging.level.root=INFO
logging.level.com.serv=INFO

# VenusUser uses JOINED inheritance WITH an explicit discriminator column (user_type), which existing
# data relies on. Hibernate warns (HHH000457) on every start that it applies it: this is intended.
logging.level.org.hibernate.boot.model.internal.EntityBinder=ERROR

# Session (JWT) lifetime. Tokens stay revocable (ban, password change) whatever their lifetime.
app.jwt.expiration=30d

# Email texts (messages*.properties): English when the request language has no translation
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
