# application-test.properties

# 2. Base de données H2 en mémoire (Mode MySQL compatible avec hibernate)
spring.datasource.url=jdbc:h2:mem:venus_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 3. Configuration JPA / Hibernate pour les tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# 4. Isolation du stockage des fichiers (Dossier temporaire système pour éviter d'écrire sur le vrai disque)
media.upload.base=${java.io.tmpdir}/venus-test-uploads
media.public.base-url=http://localhost:8080/media

# 5. URL du frontend pour les liens de mails dans les tests
app.frontend-url=http://localhost:4200
app.registration.email-verification-required=false