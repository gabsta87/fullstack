# application-example.properties
# Rename to application-dev.properties and fill in the values

server.port=8080

# Base de données MySQL locale
spring.datasource.url=jdbc:mysql://localhost:3306/venu_db
spring.datasource.username=root
spring.datasource.password=YOUR_PASSWORD
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# Stratégie Hibernate pour le dev
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.hibernate.ddl-auto=create-drop

# Stripe dev
stripe.secret.key=sk_test_123456...
stripe.public.key=pk_test_123456...

# Mailtrap dev
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=YOUR_MAILTRAP_USER
spring.mail.password=YOUR_MAILTRAP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=false

# To host from localhost, change the URL to your IP address for example 122.122.122.122
app.frontend-url=http://localhost:4200
# app.frontend-url=http://122.122.122.122:4200
media.public.base-url=http://localhost:8080/media
# media.public.base-url=http://122.122.122.122:8080/media

# Local storage for project files
media.upload.base=/Users/USERNAME/projects-files
app.registration.email-verification-required=false

# DEBUGGING
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE