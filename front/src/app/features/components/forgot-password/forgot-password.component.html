<ion-content class="ion-padding ion-text-center">
  <h2>Mot de passe oublié</h2>
  <p class="ion-margin-bottom">Saisissez votre adresse email pour recevoir un lien de réinitialisation.</p>

  <!-- 🎯 Le secret du bouton Entrée est ici : (ngSubmit) sur le formulaire -->
  <form (ngSubmit)="sendRequest()" #forgotForm="ngForm">
    <ion-item lines="full" class="ion-margin-bottom">
      <!-- Ajout de type="email" et de l'id pour le focus -->
      <ion-input
        type="email"
        name="email"
        [(ngModel)]="email"
        [required]="true"
        placeholder="Votre email">
      </ion-input>
    </ion-item>

    <!-- Le bouton doit impérativement être de type="submit" -->
    <ion-button expand="block" type="submit" [disabled]="forgotForm.invalid ?? false">
      Envoyer le lien
    </ion-button>

    <ion-button fill="clear" expand="block" (click)="close()">
      Annuler
    </ion-button>
  </form>
</ion-content>
