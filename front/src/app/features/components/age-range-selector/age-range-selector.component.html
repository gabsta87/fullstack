@if (languageService.currentLanguage$ | async; as t) {
  <ion-item lines="none" class="filter-input-item age-range-item">
    <ion-range
      labelPlacement="start"
      [label]="($safeNavigationMigration(t.common?.age)) + ' ' + currentLower + ' - ' + (currentUpper === 60 ? '60+' : currentUpper + ' ' + ($safeNavigationMigration(t.common?.years)))"
      [dualKnobs]="true"
      [min]="18"
      [max]="60"
      [pin]="true"
      [value]="{ lower: currentLower, upper: currentUpper }"
      (ionInput)="onRangeInput($event)"
      (ionKnobMoveEnd)="onRangeChangeEnd($event)">
    </ion-range>
  </ion-item>
}
