<ion-item lines="none" class="filter-input-item age-range-item" *ngIf="languageService.currentLanguage$ | async as t">
  <ion-range
    labelPlacement="start"
    [label]="(t.age?.label) + ' ' + currentLower + ' - ' + (currentUpper === 60 ? '60+' : currentUpper + ' ' + (t.age?.years))"
    [dualKnobs]="true"
    [min]="18"
    [max]="60"
    [pin]="true"
    [value]="{ lower: currentLower, upper: currentUpper }"
    (ionInput)="onRangeInput($event)"
    (ionKnobMoveEnd)="onRangeChangeEnd($event)">
  </ion-range>
</ion-item>
