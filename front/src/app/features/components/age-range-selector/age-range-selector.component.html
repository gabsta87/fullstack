<ion-item lines="none" class="filter-input-item age-range-item">
  <ion-range
    labelPlacement="start"
    [label]="'Âge : ' + currentLower + ' - ' + (currentUpper === 60 ? '60+' : currentUpper + ' ans')"
    [dualKnobs]="true"
    [min]="18"
    [max]="60"
    [pin]="true"
    [value]="{ lower: currentLower, upper: currentUpper }"
    (ionInput)="onRangeInput($event)"
    (ionKnobMoveEnd)="onRangeChangeEnd($event)">
  </ion-range>
</ion-item>
