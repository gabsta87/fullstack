<app-header></app-header>

<ion-header class="ion-no-border profile-header-bar">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()" color="dark">
        <ion-icon slot="start" name="chevron-back-outline"></ion-icon>
        Retour
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="profile-content">
  <div class="profile-wrap" *ngIf="worker">
    <div class="layout fade-in">

      <aside class="sidebar">
        <div class="profile-card">
          <img [src]="worker.mainThumbUrl" alt="Avatar" class="avatar-img">
          <h2>{{ worker.username }}</h2>
          <p class="location"><ion-icon name="location-outline"></ion-icon> {{ worker.geographicZone?.name }}</p>
        </div>

        <div class="profile-card actions-card">
          <ion-button expand="block" color="primary">Contacter</ion-button>

          <ion-button *ngIf="isClient" expand="block" fill="outline" color="medium" (click)="toggleFavorite()">
            <ion-icon slot="start" [name]="isFavorite ? 'heart' : 'heart-outline'" [color]="isFavorite ? 'danger' : ''"></ion-icon>
            Favoris
          </ion-button>

          <ion-button *ngIf="isClient" expand="block" fill="outline" color="medium" (click)="toggleNotify()">
            <ion-icon slot="start" [name]="notifyEnabled ? 'notifications' : 'notifications-outline'"></ion-icon>
            Me notifier son retour
          </ion-button>
        </div>

        <div class="profile-card">
          <ion-list lines="none">
            <ion-item>
              <ion-icon name="body-outline" slot="start"></ion-icon>
              <ion-label>Silhouette : {{ worker.bodyType }}</ion-label>
            </ion-item>
            <ion-item>
              <ion-icon name="woman-outline" slot="start"></ion-icon>
              <ion-label>Age : {{ worker.age }}</ion-label>
            </ion-item>
          </ion-list>
        </div>
      </aside>

      <main class="main-content">

        <!-- Section Photos -->
        <div class="profile-card" *ngIf="worker.photos && worker.photos.length > 0">
          <h3>Photos</h3>
          <div class="gallery-grid">
            <img *ngFor="let p of worker.photos"
                 [src]="p.previewThumbUrl"
                 (click)="openMedia(p)">
          </div>
        </div>

        <!-- Section Vidéos -->
        <div class="profile-card ion-margin-top" *ngIf="worker.videos && worker.videos.length > 0">
          <h3>Vidéos</h3>
          <div class="gallery-grid">
            <div *ngFor="let v of worker.videos" class="video-thumbnail-container" (click)="openMedia(v)">
              <ion-icon name="play-circle-outline" class="play-icon-overlay"></ion-icon>
              <video [src]="v.url" preload="metadata" muted></video>
            </div>
          </div>
        </div>

        <div class="profile-card ion-margin-top">
          <h3>À propos</h3>
          <p>{{ worker.description }}</p>

          <div class="chips-group ion-margin-top">
            <ion-chip *ngFor="let s of worker.services">
              <ion-label>{{ s }}</ion-label>
            </ion-chip>
          </div>
        </div>

        <div *ngIf="worker.reviews" class="profile-card ion-margin-top">
          <h3>Avis ({{ worker.reviews.length }})</h3>
        </div>
      </main>

    </div>

    <ion-modal [isOpen]="isImageOpen" class="fullscreen-photo-modal" (ionModalDidDismiss)="closeFullSizeImage()">
      <ng-template>
        <ion-content class="modal-swiper-content">

          <!-- Bouton croix pour fermer -->
          <ion-button fill="clear" class="close-modal-btn" (click)="closeFullSizeImage()">
            <ion-icon name="close-outline" slot="icon-only"></ion-icon>
          </ion-button>

          <div class="gallery-container" *ngIf="modalMedia.length > 0">
            <swiper-container
              #swiperRef
              slides-per-view="1"
              loop="true"
              space-between="0"
              class="banner-slides border-swiper">

              <swiper-slide *ngFor="let media of modalMedia">
                <div class="slide-content-wrapper">

                  <!-- Vidéo -->
                  <video
                    *ngIf="media.type === 'video'"
                    [src]="media.url"
                    controls
                    playsinline
                    preload="metadata"
                    class="fullscreen-media">
                  </video>

                  <!-- Image -->
                  <img
                    *ngIf="media.type === 'photo'"
                    [src]="media.url"
                    class="fullscreen-media"/>

                  <!-- Flèches de navigation -->
                  <ion-icon (click)="slidePrev()" class="gallerySideButton left" name="chevron-back-outline"></ion-icon>
                  <ion-icon (click)="slideNext()" class="gallerySideButton right" name="chevron-forward-outline"></ion-icon>
                </div>
              </swiper-slide>

            </swiper-container>
          </div>

        </ion-content>
      </ng-template>
    </ion-modal>

  </div>
</ion-content>
