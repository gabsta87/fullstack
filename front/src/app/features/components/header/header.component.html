<ion-header class="ion-no-border main-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button routerLink="/" fill="clear" class="brand-button">
        <span class="brand">
          <span class="brand-mark">◆</span> Venus
        </span>
      </ion-button>
    </ion-buttons>

    <ion-buttons slot="end">
      <!-- 🎯 Le déclencheur DOIT rester permanent dans le DOM pour que le popover fonctionne -->
      <ion-button id="lang-selector-trigger">
        <img [src]="langService.currentLanguageFlag" class="header-flag-icon" alt="Langue active" />
        <ion-text class="ion-hide-sm-down" style="margin-left: 5px; font-size: 14px;">
          {{ langService.currentCode }}
        </ion-text>
      </ion-button>

      <!-- Le reste des boutons qui dépendent des traductions -->
      <ng-container *ngIf="langService.currentLanguage$ | async as t">
        <ng-container *ngIf="!(authService.isAuthenticated$ | async)">
          <ion-button (click)="openAuth('login')" fill="clear" class="nav-link-btn">
            <ion-icon name="log-in-outline" slot="start"></ion-icon>
            {{ t.header?.login }}
          </ion-button>
          <ion-button (click)="openAuth('register')" fill="solid" class="nav-cta-btn">
            {{ t.header?.register }}
          </ion-button>
        </ng-container>

        <ng-container *ngIf="authService.isAuthenticated$ | async">
          <ng-container *ngIf="authService.isAdmin">
            <ion-button (click)="openAdmin()" fill="clear" class="nav-link-btn">
              <ion-icon name="build-outline" slot="start"></ion-icon>
              {{ t.admin?.tabs?.admins || 'Administration' }}
            </ion-button>
          </ng-container>

          <ion-button (click)="openAccount()" fill="clear" class="nav-link-btn">
            <ion-icon name="person-circle-outline" slot="start"></ion-icon>
            {{ t.header?.account }}
          </ion-button>
          <ion-button (click)="onLogout()" fill="clear" class="nav-link-btn">
            <ion-icon name="log-out-outline" slot="start"></ion-icon>
            {{ t.header?.logout }}
          </ion-button>
        </ng-container>
      </ng-container>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<!-- Popover de choix de la langue (relié au bouton permanent ci-dessus) -->
<ion-popover trigger="lang-selector-trigger" [dismissOnSelect]="true" side="bottom" alignment="end">
  <ng-template>
    <ion-content>
      <ion-list lines="none" class="lang-popover-list">
        <ion-item *ngFor="let lang of langService.availableLanguages"
                  (click)="changeLanguage(lang.code)"
                  [class.active-lang]="lang.code === langService.currentCode">
          <img slot="start" [src]="lang.flag" class="popover-flag-icon" [alt]="lang.label" />
          <ion-label>{{ lang.label }}</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ng-template>
</ion-popover>
