<ion-content class="ion-padding">
  <div class="auth-card">
    <h2>Nouveau mot de passe</h2>
    <p>Définissez votre nouveau mot de passe de connexion.</p>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" *ngIf="token && !isSuccess">
      <ion-item lines="full" class="ion-margin-bottom">
        <ion-input type="password" formControlName="newPassword" placeholder="Nouveau mot de passe"></ion-input>
      </ion-item>

      <ion-item lines="full" class="ion-margin-bottom">
        <ion-input type="password" formControlName="confirmPassword" placeholder="Confirmer le mot de passe"></ion-input>
      </ion-item>

      <p *ngIf="resetForm.errors?.['mismatch'] && resetForm.get('confirmPassword')?.touched" color="danger" class="error-txt">
        Les mots de passe ne correspondent pas.
      </p>

      <p *ngIf="errorMsg" class="error-txt">{{ errorMsg }}</p>

      <ion-button expand="block" type="submit" [disabled]="resetForm.invalid || isLoading">
        <ion-spinner name="crescent" *ngIf="isLoading"></ion-spinner>
        <span *ngIf="!isLoading">Mettre à jour</span>
      </ion-button>
    </form>

    <div *ngIf="!token" class="error-box">
      <p>Le jeton de réinitialisation est manquant ou invalide.</p>
      <ion-button fill="outline" routerLink="/forgot-password">Refaire une demande</ion-button>
    </div>

    <div *ngIf="isSuccess" class="ion-text-center">
      <ion-icon name="checkmark-circle-outline" color="success" size="large"></ion-icon>
      <p>Votre mot de passe a été modifié avec succès.</p>
      <ion-button expand="block" routerLink="/home">Retour à l'accueil</ion-button>
    </div>
  </div>
</ion-content>
