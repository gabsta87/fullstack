# nginx.conf

server {
    listen 8081;
    server_name _; # Accepte les requêtes de n'importe quel nom de domaine/IP rejoignant ce port

    # 1. Gestion des fichiers médias
    location /media/ {
        alias /var/serv-media/;
        autoindex off;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
    }

    # 2. Redirection des requêtes API vers le conteneur backend
    location /api/ {
        proxy_pass http://venus-backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Application Angular
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
