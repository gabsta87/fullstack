# Keep the scheme set by an upstream reverse proxy (Synology terminates HTTPS), else use our own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# nginx.conf

server {
    listen 8081;
    server_name _; # Accepte les requêtes de n'importe quel nom de domaine/IP rejoignant ce port

    server_tokens off;
    # Must stay >= spring.servlet.multipart.max-request-size (110MB)
    client_max_body_size 110m;

    # Security headers (repeated in locations that define their own add_header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Certification photos are private (served by the API to admins only).
    # Blocks any legacy file that would still be in the public directory.
    location ~ ^/media/[^/]+/certification/ {
        return 404;
    }

    # 1. Gestion des fichiers médias
    location /media/ {
        alias /var/serv-media/;
        autoindex off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
    }

    # 2. Redirection des requêtes API vers le conteneur backend
    location /api/ {
        proxy_pass http://venus-backend:8080/;
        # Spring must see the exact public origin (scheme, host AND port) to recognise that the page and
        # the API share it; otherwise browser POSTs (login...) are refused as cross-origin (403).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # 3. Application Angular
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
